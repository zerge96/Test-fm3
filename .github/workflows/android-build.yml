name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repo auschecken
      uses: actions/checkout@v4

    - name: JDK 17 einrichten
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Android SDK einrichten
      uses: android-actions/setup-android@v3
      with:
        api-level: 33
        components: |
          platform-tools
          cmdline-tools;latest
          build-tools;33.0.3

    - name: Persistiere ANDROID_SDK_ROOT für nachfolgende Schritte
      run: echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV

    - name: Debug APK bauen
      env:
        ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
      run: ./gradlew :MySDRApp:assembleDebug --no-daemon --stacktrace

    - name: APK als Artifact hochladen
      uses: actions/upload-artifact@v4
      with:
        name: FrequenzyMonitor2.0-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
