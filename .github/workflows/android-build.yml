name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Führt alle Schritte direkt im Projektordner aus
    defaults:
      run:
        working-directory: MySDRApp

    steps:
    - name: Repo auschecken
      uses: actions/checkout@v4

    - name: JDK 17 einrichten
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradlew Ausführungsrechte erteilen
      run: chmod +x gradlew

    - name: Debug APK bauen
      run: ./gradlew assembleDebug

    - name: APK als Artifact hochladen
      uses: actions/upload-artifact@v4
      with:
        name: FrequenzyMonitor2.0-Debug-APK
        path: MySDRApp/build/outputs/apk/debug/*.apk
